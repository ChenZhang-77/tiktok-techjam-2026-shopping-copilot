<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track 4 Process Visualizer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Shopping Copilot Dialogue</h1>
        <p>Inspect one selected customer session and its completed Agent trace.</p>
      </div>
      <div class="controls" aria-label="Run controls">
        <label>
          Experiment
          <select id="experimentSelect"></select>
        </label>
        <label>
          Session
          <select id="sessionSelect"></select>
        </label>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Session metadata">
        <section class="side-panel">
          <h2>Overall Metrics</h2>
          <dl id="overallMetrics"></dl>
          <div id="scenarioMetrics" class="scenario-metrics"></div>
        </section>
        <section class="side-panel">
          <h2>Current Customer</h2>
          <dl id="sessionMeta"></dl>
          <h3>Target Product</h3>
          <div id="targetBox" class="target-box">Select a session and start it.</div>
          <h3>Session Result</h3>
          <div id="finalBox" class="final-box">Waiting.</div>
        </section>
      </aside>

      <section class="timeline" aria-label="Realtime conversation turns">
        <div class="timeline-header">
          <h2>Dialogue</h2>
          <span id="statusText">Idle</span>
        </div>
        <div id="chat" class="chat"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
