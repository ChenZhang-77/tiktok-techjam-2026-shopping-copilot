<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track 4 Process Visualizer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Shopping Copilot Dialogue</h1>
        <p>Local offline simulation · simulated customers, not a live-chat service.</p>
      </div>
      <div class="controls" aria-label="Run controls">
        <label>
          Experiment
          <select id="experimentSelect"></select>
        </label>
        <label>
          Session
          <select id="sessionSelect"></select>
        </label>
        <label>
          Interval (seconds)
          <input id="intervalInput" type="number" min="0" max="60" step="0.1" value="0.7">
        </label>
        <button id="startButton" type="button">Start</button>
        <button id="stopButton" type="button" disabled>Stop</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Session metadata">
        <section class="side-panel">
          <h2>Recorded Evaluation</h2>
          <dl id="overallMetrics"></dl>
          <div id="scenarioMetrics" class="scenario-metrics"></div>
        </section>
        <section class="side-panel">
          <h2>Evaluator-only Session Results</h2>
          <dl id="sessionMeta"></dl>
          <div id="sessionOutcome" class="session-outcome">Waiting for dialogue.</div>
        </section>
      </aside>

      <section class="timeline" aria-label="Realtime conversation turns">
        <div class="timeline-header">
          <h2>Agent Exchange + Evaluator Annotations</h2>
          <span id="statusText">Idle</span>
          <span id="turnProgress">Ready</span>
        </div>
        <div id="chat" class="chat"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
